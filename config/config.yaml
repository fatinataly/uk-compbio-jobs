  # ---- University and research institute jobs (RSS) ----
  # On jobs.ac.uk run a search (e.g. "bioinformatics"), click the RSS icon on the
  # results page and paste the feed address as `url`. One entry per search.
  - name: jobs.ac.uk bioinformatics
    ats: rss
    url: https://www.jobs.ac.uk/feeds/subject-areas/biological-sciences/bioinformatics
    company_from_title: true
    disabled: true   # enable after pasting a working feed URL

